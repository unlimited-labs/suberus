name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma generate

      - run: pnpm exec oxfmt --check

      - run: pnpm exec oxlint

      # Gates the sloppiness numerators against sloppiness-baseline.json.
      - run: pnpm sloppiness

      # build is the typecheck: vite-plugin-checker gates types and generates
      # routeTree.gen.ts (a standalone tsc can't). Before test for route imports.
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          APP_BASE_URL: http://localhost:3001
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          SMTP_FROM_EMAIL: noreply@suberus.local
          AUTH_SECRET: ci-build-secret-not-used-at-runtime-0000

      - run: pnpm test

  # Shared services serve every Instance from one version: /v1 must stay additive-only.
  services:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: services/**/uv.lock

      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends pandoc

      - working-directory: services/common/admission
        run: uv run --frozen pytest -q

      - working-directory: services/pdf-api
        run: uv run --frozen --with pytest pytest -q

      - name: OpenAPI snapshots match the code
        run: |
          services/openapi-snapshot.sh
          git diff --exit-code -- 'services/*/openapi.json'

      - name: No breaking /v1 change
        run: services/openapi-breaking.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
