name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to build
        default: master
      targets:
        description: Bake targets to build (space-separated; empty = all)
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - id: ref
        run: echo "sha=${{ github.event.workflow_run.head_sha || inputs.ref }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - id: meta
        run: |
          echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "calver=$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        run: docker buildx bake --push ${{ inputs.targets }}
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          TAG: ${{ steps.meta.outputs.tag }}
          CALVER: ${{ steps.meta.outputs.calver }}
          GIT_COMMIT: ${{ steps.ref.outputs.sha }}
          BUILD_DATE: ${{ steps.meta.outputs.date }}
