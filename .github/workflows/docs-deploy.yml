name: Docs Deploy
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with: { version: 11 }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: docs

      - run: pnpm build
        working-directory: docs

      - name: Upload docs/dist via SFTP
        env:
          SFTP_HOST: s0.mydevil.net
          SFTP_USER: kbzowski
          SFTP_REMOTE_PATH: /home/kbzowski/domains/docs.suberus.app/public_html
          SFTP_KEY: ${{ secrets.DOCS_SFTP_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.DOCS_SFTP_KNOWN_HOSTS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$SFTP_KEY" > /tmp/deploy_key
          lftp -u "$SFTP_USER," "sftp://$SFTP_HOST" \
            -e "set sftp:connect-program 'ssh -i /tmp/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes'; \
                mirror -R --delete --verbose \
                  --exclude-glob .well-known/ \
                  --exclude-glob .htaccess \
                  --exclude-glob cgi-bin/ \
                  docs/dist $SFTP_REMOTE_PATH; \
                bye"
