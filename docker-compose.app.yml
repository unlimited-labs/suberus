include:
  - docker-compose.yml

services:
  migrate:
    build:
      context: .
      target: migrate
    container_name: suberus-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://suberus:suberus_dev_password@postgres:5432/suberus?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - suberus-network

  app:
    build:
      context: .
    container_name: suberus-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://suberus:suberus_dev_password@postgres:5432/suberus?schema=public
      S3_ENDPOINT: http://garage:3902
      S3_ACCESS_KEY_ID: GK3e3e0ddba78338b89bbef493
      S3_SECRET_ACCESS_KEY: cc8249828908ff35d1509377e5ed4c7eedf6592979d67eb7a3915d5480a3c15f
      S3_BUCKET: suberus-files
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_EMAIL: noreply@suberus.local
      AUTH_SECRET: dev-secret-key-change-in-production-please-use-at-least-32-chars
      APP_BASE_URL: http://localhost:3001
      NODE_ENV: production
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      electric:
        condition: service_started
      garage:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - suberus-network
