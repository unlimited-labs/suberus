# Security pins for transitive CVEs (Dependabot). Each forces a patched version that the
# parent ranges have not yet re-resolved to. Drop an entry once the parent ships the fix.
overrides:
  'undici@^7.0.0': 7.29.0
  'undici@^6.0.0': 6.28.0
  hono: 4.12.34
  shell-quote: 1.9.0
  ws: 8.21.0
  fast-uri: 3.1.5
  seroval: 1.6.2
  qs: 6.15.2
  'brace-expansion@^5.0.0': 5.0.9
  'brace-expansion@^2.0.0': 2.1.4
  ip-address: 10.3.1
  launch-editor: 2.14.1
  esbuild: 0.28.1
  '@hono/node-server': 1.19.15
  dompurify: 3.4.13
  js-yaml: 4.3.1
  'nanoid@^3.0.0': 3.3.18
  'nanoid@^5.0.0': 5.1.16
  postcss: 8.5.23
  svgo: 4.0.2
  valibot: 1.4.2

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  msw: true
  prisma: true
onlyBuiltDependencies: lefthook

minimumReleaseAge: 10080
# Pinned to exact versions; the age guard adds nothing over an exact pin, and 1.7.1 GA
# is younger than the window. Drop once 1.7.x has aged past it.
minimumReleaseAgeExclude:
  - better-auth
  - '@better-auth/*'
  # 1.26.2 is the newest aged build, but it carries miscompilations fixed in 1.26.3+.
  # Drop once 1.27.0 ages past the window.
  - zod-compiler
  # 6.4.1 carries the DOM.sanitize fix (adjacent dangerous attributes survived).
  # Drop once it ages past the window.
  - maplibre-gl
