# Security pins for transitive CVEs (Dependabot). Each forces a patched version that the
# parent ranges have not yet re-resolved to. Drop an entry once the parent ships the fix.
overrides:
  'undici@^7.0.0': 7.28.0
  hono: 4.12.25
  shell-quote: 1.8.4
  ws: 8.21.0
  fast-uri: 3.1.2
  seroval: 1.5.4
  qs: 6.15.2
  'brace-expansion@^5.0.0': 5.0.6
  ip-address: 10.1.1
  launch-editor: 2.14.1
  esbuild: 0.28.1
  '@hono/node-server': 1.19.14

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  msw: true
  prisma: true
onlyBuiltDependencies: lefthook

minimumReleaseAge: 10080
# Pinned to exact RC versions; the age guard adds nothing over an exact pin, and
# the RC line ships faster than the window. Drop once 1.7 reaches GA.
minimumReleaseAgeExclude:
  - better-auth
  - '@better-auth/*'
