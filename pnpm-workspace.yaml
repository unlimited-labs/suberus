# Security pins for transitive CVEs (Dependabot). Each forces a patched version that the
# parent ranges have not yet re-resolved to. Drop an entry once the parent ships the fix.
# kysely: 0.28.17 is bugfix-only (JSON-path injection fix) and stays <0.29, so the
# @better-auth/kysely-adapter resolves fine (we use the Prisma adapter; kysely is a dead path).
overrides:
  kysely: 0.28.17
  'undici@^7.0.0': 7.28.0
  hono: 4.12.25
  shell-quote: 1.8.4
  ws: 8.21.0
  fast-uri: 3.1.2
  seroval: 1.5.4
  qs: 6.15.2
  'brace-expansion@^5.0.0': 5.0.6
  ip-address: 10.1.1
  launch-editor: 2.14.1
  esbuild: 0.28.1
  '@hono/node-server': 1.19.14

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  msw: true
  prisma: true
onlyBuiltDependencies: lefthook
