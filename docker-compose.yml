services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: suberus-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: suberus
      POSTGRES_PASSWORD: suberus_dev_password
      POSTGRES_DB: suberus
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_connections=300"
    volumes:
      - ./dev-volumes/postgres_data:/var/lib/postgresql
    networks:
      - suberus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suberus"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: docker.io/pgsty/silo:latest
    container_name: suberus-minio
    command: server /data --console-address ":9090"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./dev-volumes/minio_data:/data
    ports:
      - 7090:9090
      - 7000:9000
    networks:
      - suberus-network
  mailpit:
    image: axllent/mailpit:latest
    container_name: suberus-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_DISABLE_RDNS: true
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - suberus-network
  pdf-api:
    build: ./services/pdf-api
    container_name: suberus-pdf-api
    restart: unless-stopped
    ports:
      - "8100:8100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8100/')",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - suberus-network
  docx-api:
    build:
      context: ./services/docx-api
      target: runtime
    container_name: suberus-docx-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8101:8101"
    environment:
      DOCX_API_TOKEN: ${DOCX_API_TOKEN:-}
    mem_limit: 2g
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8101/')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - suberus-network
  planner:
    build: ./services/planner-api
    container_name: suberus-planner
    restart: unless-stopped
    ports:
      - "8110:8110"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8110/')",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - suberus-network

networks:
  suberus-network:
    driver: bridge
