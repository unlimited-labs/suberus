pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,md,yml,yaml,html}"
      # Sequential on purpose: both write the same files.
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files} && pnpm biome check --write --staged --no-errors-on-unmatched
      stage_fixed: true
    slop:
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec oxlint --no-error-on-unmatched-pattern {staged_files}
    types:
      run: pnpm tsc --noEmit

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
