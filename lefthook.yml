pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,md,yml,yaml,html}"
      # One chain: every step writes files the next one reads. oxlint runs twice
      # because jsx-sort-props reaches nested elements only on a second pass; the
      # second run doubles as the gate.
      run: >
        pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files} &&
        pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files} &&
        pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    types:
      run: pnpm tsc --noEmit

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
