pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx,json,css}"
      run: pnpm biome check --write --staged --no-errors-on-unmatched
      stage_fixed: true
    types:
      run: pnpm tsc --noEmit

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
