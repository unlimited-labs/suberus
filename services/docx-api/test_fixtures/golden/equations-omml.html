<h1 id="native-word-equations-omml" class="csb4fde411ae">Native Word equations (OMML)</h1>

<p><span class="math display">$$x = \frac{- b \pm \sqrt{b^{2} - 4ac}}{2a}$$</span></p>
<p>Fraction (inline):</p>
<p><span class="math inline">$\frac{g}{4}$</span></p>

<p><span class="math display">∫<sub><em>a</em></sub><sup><em>b</em></sup><em>f</em>(<em>x</em>)<em>d</em><em>x</em></span></p>
