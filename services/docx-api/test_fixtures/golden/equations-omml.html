<h1 id="native-word-equations-omml" class="csb4fde411ae">Native Word equations (OMML)</h1>
<p>Quadratic formula (display):</p>
<p><span class="math display">\[x = \frac{- b \pm \sqrt{b^{2} - 4ac}}{2a}\]</span></p>
<p>Fraction (inline):</p>
<p><span class="math inline">\(\frac{g}{4}\)</span></p>
<p>Definite integral (display):</p>
<p><span class="math display">\[\int_{a}^{b}{f(x)dx}\]</span></p>
<p>Greek with superscript (inline):</p>
<p><span class="math inline">\(\alpha^{2} + \beta\)</span></p>
