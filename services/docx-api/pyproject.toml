[project]
name = "suberus-docx-api"
version = "0.1.0"
description = "DOCX -> normalized-HTML + rasterized-figure bundle for the submission version-diff pipeline"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "python-multipart==0.0.*",
    "Pillow==11.*",
    "xmldiff==3.0.*",
    "lxml>=5,<7",
    "olefile==0.47.*",
    "pyHanko[image-support]==0.35.*",
    "qrcode==8.*",
    "cryptography>=43",
]

[project.optional-dependencies]
# Test + fixture-generation deps. The baseline tests also need the system
# binaries `pandoc` and `soffice` (LibreOffice) — run them in the `test` Docker
# stage (see Dockerfile) which has the pinned toolchain.
test = ["pytest>=8,<10", "python-docx==1.*"]

# Lint + complexity (Python "fallow-equivalent"). Advisory; run via uvx. See README.
dev = ["ruff", "radon"]

[tool.uv]
package = false

# Runtime also requires the system binaries `pandoc` (pinned) and `soffice`
# (LibreOffice) on PATH — see Dockerfile. Not Python packages.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["test_fixtures"]

[tool.ruff.lint]
select = ["F", "I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["main", "config", "core", "routers", "omml", "signing", "diffhtml", "mathtype", "stylecss", "htmlesc", "ooxml"]
